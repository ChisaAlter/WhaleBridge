name: CNB mirror
on:
  release:
    types: [published]
  workflow_run:
    workflows: [WhaleBridge]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Published WhaleBridge release to mirror (blank uses latest)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: cnb-mirror
  cancel-in-progress: false
jobs:
  sync:
    if: >-
      github.repository == 'ChisaAlter/WhaleBridge' &&
      ((github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Mirror selected component tag and published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            version=$(git show '${{ github.event.workflow_run.head_sha }}:upstream.json' | node -e 'let b="";process.stdin.on("data",s=>b+=s);process.stdin.on("end",()=>console.log(JSON.parse(b).version))')
            export RELEASE_TAG="whalebridge-v$version"
          fi
          node scripts/sync-cnb.mjs
